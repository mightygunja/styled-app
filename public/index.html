<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Primary meta. The title here is the crawler-facing default; React
         Navigation swaps document.title per screen once the app boots. -->
    <title>33 Trends — AI Personal Stylist for the Clothes You Own</title>
    <meta
      name="description"
      content="Photograph your closet and get daily outfit recommendations from clothes you already own — matched to your style profile, the occasion and the weather. Free, every feature."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.thirtythreetrends.com/" />
    <meta name="theme-color" content="#FDFBFA" />

    <!-- impact.com property verification (publisher account "Thirty Three
         Trends", added 2026-09-04 for the Lulus/Quince applications). Impact's
         checker looks for the non-standard `value` attribute, not `content` -
         do not "correct" it. Safe to remove once the property shows Verified. -->
    <meta name="impact-site-verification" value="d05c1e0d-2eaa-4843-a436-afacd1dfe47d" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="33 Trends" />
    <meta property="og:title" content="33 Trends — AI Personal Stylist for the Clothes You Own" />
    <meta
      property="og:description"
      content="Photograph your closet and get daily outfit recommendations from clothes you already own — matched to your style profile, the occasion and the weather. Free, every feature."
    />
    <meta property="og:url" content="https://www.thirtythreetrends.com/" />
    <meta property="og:image" content="https://www.thirtythreetrends.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="33 Trends — personal styling from the clothes you own" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="33 Trends — AI Personal Stylist for the Clothes You Own" />
    <meta
      name="twitter:description"
      content="Photograph your closet and get daily outfit recommendations from clothes you already own. Free, every feature."
    />
    <meta name="twitter:image" content="https://www.thirtythreetrends.com/og-image.png" />

    <!-- Structured data: who this is and what the application does. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.thirtythreetrends.com/#org",
            "name": "33 Trends",
            "url": "https://www.thirtythreetrends.com/",
            "logo": "https://www.thirtythreetrends.com/og-image.png",
            "email": "support@thirtythreetrends.com"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.thirtythreetrends.com/#site",
            "name": "33 Trends",
            "url": "https://www.thirtythreetrends.com/",
            "publisher": { "@id": "https://www.thirtythreetrends.com/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "33 Trends",
            "url": "https://www.thirtythreetrends.com/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "Web",
            "description": "AI personal styling from the clothes you already own: photograph your closet, get daily outfit recommendations matched to your style profile, the occasion and the weather.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@id": "https://www.thirtythreetrends.com/#org" }
          }
        ]
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Real content for crawlers and readers without JavaScript, not a bare
         "enable JavaScript" scold. -->
    <noscript>
      <div style="font-family: Georgia, serif; max-width: 640px; margin: 48px auto; padding: 0 24px; color: #1c1c1c">
        <h1 style="font-weight: normal">33 Trends</h1>
        <p>
          An AI personal stylist built on the clothes you already own. Photograph your closet and
          get a fresh outfit every morning — matched to your style profile, the occasion and the
          weather — plus shopping recommendations that fill real gaps in your wardrobe. Free,
          every feature.
        </p>
        <p>
          33 Trends needs JavaScript to run. Please enable it, or write to
          support@thirtythreetrends.com.
        </p>
      </div>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- Skimlinks auto-affiliation. Publisher site id 308107X1796404 - the
         same id the server-side link wrapper uses (SKIMLINKS_PUBID in
         functions/.env). Their approvals crawler also checks for this tag,
         so it must stay on the page even though the app wraps Shop links
         itself. -->
    <script type="text/javascript" src="https://s.skimresources.com/js/308107X1796404.skimlinks.js"></script>
  </body>
</html>
